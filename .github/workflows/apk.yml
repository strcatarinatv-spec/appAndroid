# A cada envio para a main: gera o APK e publica em Releases (v<versão do config.xml>)
name: APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Gerar
        env: { KEYSTORE_B64: '${{ secrets.KEYSTORE_B64 }}', KEYSTORE_PASS: '${{ secrets.KEYSTORE_PASS }}' }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/c.jks"; export KEYSTORE_FILE="$RUNNER_TEMP/c.jks"; fi
          gradle assembleRelease --console=plain
      - name: Publicar
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          v=$(grep -oP 'version="\K[\d.]+' www/config.xml | head -1)
          cp app/build/outputs/apk/release/app-release.apk CatarinaTV-$v.apk
          gh release view v$v >/dev/null 2>&1 || gh release create v$v --title "Catarina TV $v" --notes "APK para Android TV"
          gh release upload v$v CatarinaTV-$v.apk --clobber
